<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Навигатор интерактивных платформ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --white: #ffffff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 0; color: #333; }
        header { background: var(--primary); color: white; padding: 30px 20px; text-align: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 20px; }
        
        h2 { border-left: 5px solid var(--accent); padding-left: 15px; color: var(--primary); }

        /* Сетка платформ */
        .platform-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
            margin: 20px 0; 
        }
        .platform-card {
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }
        .platform-card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .platform-card.selected { border-color: var(--accent); background: #eef7ff; }
        
        .platform-card i { font-size: 40px; color: var(--accent); margin-bottom: 10px; }
        .platform-card h3 { margin: 10px 0 5px; font-size: 18px; }
        
        .link-btn {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .link-btn:hover { text-decoration: underline; }

        /* Калькулятор */
        .calc-box {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        .step { margin-bottom: 20px; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        
        #calcBtn {
            width: 100%;
            padding: 15px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        #resultArea {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            border: 1px solid var(--accent);
            background: #f9fcff;
        }
    </style>
</head>
<body>

<header>
    <h1>Методический навигатор</h1>
    <p>Выбор инструментов для учащихся 5–9 классов [cite: 35]</p>
</header>

<div class="container">
    <h2>1. Выберите платформу</h2>
    <div class="platform-grid" id="grid">
        <div class="platform-card" onclick="selectPlatform('Quizizz', 'https://quizizz.com')">
            <i class="fas fa-bolt"></i>
            <h3>Quizizz</h3>
            <a href="https://quizizz.com" target="_blank" class="link-btn">Открыть сайт <i class="fas fa-external-link-alt"></i></a>
        </div>
        <div class="platform-card" onclick="selectPlatform('Genially', 'https://genially.com')">
            <i class="fas fa-project-diagram"></i>
            <h3>Genially</h3>
            <a href="https://genially.com" target="_blank" class="link-btn">Открыть сайт <i class="fas fa-external-link-alt"></i></a>
        </div>
        <div class="platform-card" onclick="selectPlatform('LearningApps', 'https://learningapps.org')">
            <i class="fas fa-puzzle-piece"></i>
            <h3>LearningApps</h3>
            <a href="https://learningapps.org" target="_blank" class="link-btn">Открыть сайт <i class="fas fa-external-link-alt"></i></a>
        </div>
        <div class="platform-card" onclick="selectPlatform('Wordwall', 'https://wordwall.net')">
            <i class="fas fa-th"></i>
            <h3>Wordwall</h3>
            <a href="https://wordwall.net" target="_blank" class="link-btn">Открыть сайт <i class="fas fa-external-link-alt"></i></a>
        </div>
        <div class="platform-card" onclick="selectPlatform('Joyteka', 'https://joyteka.com')">
            <i class="fas fa-dungeon"></i>
            <h3>Joyteka</h3>
            <a href="https://joyteka.com" target="_blank" class="link-btn">Открыть сайт <i class="fas fa-external-link-alt"></i></a>
        </div>
    </div>

    <div class="calc-box">
        <h2>2. Рассчитать вовлечение [cite: 168, 179]</h2>
        <div class="step">
            <label>Для какого класса планируется урок?</label>
            <select id="grade">
                <option value="6">6 класс (Акцент на азарт) [cite: 171]</option>
                <option value="9">9 класс (Акцент на логику) [cite: 174]</option>
            </select>
        </div>
        <input type="hidden" id="selectedPlatform" value="">
        <button id="calcBtn" onclick="runCalc()">Рассчитать эффективность</button>
        
        <div id="resultArea"></div>
    </div>
</div>

<script>
    let currentPlatform = "";

    function selectPlatform(name, link) {
        currentPlatform = name;
        // Визуальное выделение
        const cards = document.querySelectorAll('.platform-card');
        cards.forEach(c => c.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function runCalc() {
        const grade = document.getElementById('grade').value;
        const res = document.getElementById('resultArea');
        
        if (!currentPlatform) {
            alert("Сначала выберите иконку платформы выше!");
            return;
        }

        res.style.display = "block";
        let text = "";

        if (grade === "6") {
            if (currentPlatform === "Quizizz" || currentPlatform === "Wordwall") {
                text = "<strong>Результат: Высокий (83-85%) [cite: 162, 243]</strong><br>Для 6 классов идеально подходят игровые механики и быстрая обратная связь[cite: 171].";
            } else {
                text = "<strong>Результат: Средний.</strong><br>Для 6 класса лучше использовать более динамичные инструменты[cite: 75].";
            }
        } else { // 9 класс
            if (currentPlatform === "Genially" || currentPlatform === "Joyteka") {
                text = "<strong>Результат: Оптимальный (74-80%) [cite: 164, 244]</strong><br>Учащиеся 9 классов предпочитают сложные квесты и интеллектуальные задачи[cite: 174].";
            } else {
                text = "<strong>Результат: Умеренный.</strong><br>Простые викторины могут показаться девятиклассникам монотонными[cite: 174].";
            }
        }
        res.innerHTML = `<strong>Платформа: ${currentPlatform}</strong><br>${text}`;
    }
</script>

</body>
</html>
